name: Samples Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Spring L3 browser suite
        type: choice
        options: [Smoke, Full]
        default: Smoke
  merge_group:
    types: [checks_requested]
    branches: [main]
  pull_request:
    branches: [main, 'feature/**', 'topic/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  CONFIGURATION: Release
  SOLUTION: samples.slnx

jobs:
  validation:
    name: Samples shared build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Record runner and authoritative test inventory
        id: inventory
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./eng/src/agent-scripts/RepositoryAutomation.psm1 -Force
          $projects = @(Get-TestProjects -SolutionPath $env:SOLUTION)
          $levels = [ordered]@{}
          foreach ($level in @('L0Tests', 'L1Tests', 'L2Tests', 'L3Tests')) {
            $levels[$level] = @($projects | Where-Object { $_ -match "\.$level\.csproj$" }).Count
          }
          [xml]$packages = Get-Content -LiteralPath Directory.Packages.props -Raw
          $aspireVersion = ($packages.Project.ItemGroup.PackageVersion | Where-Object Include -eq 'Aspire.Hosting.AppHost').Version
          if ($aspireVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Expected one pinned Aspire version.' }
          $sdk = (Invoke-RepositoryProcess -FilePath dotnet -Arguments @('--version') | Out-String).Trim()
          $source = (Invoke-RepositoryProcess -FilePath git -Arguments @('rev-parse', 'HEAD') | Out-String).Trim()
          $null = New-Item -ItemType Directory -Path artifacts/ci-benchmark -Force
          [ordered]@{
            source = $source; sdk = $sdk; solution = $env:SOLUTION; configuration = $env:CONFIGURATION
            image = $env:ImageOS; imageVersion = $env:ImageVersion; architecture = $env:RUNNER_ARCH
            runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; aspireVersion = $aspireVersion; projects = $levels
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath artifacts/ci-benchmark/inventory.json
          "aspire-version=$aspireVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sdk=$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
      - name: Cache GitVersion tool
        id: gitversion-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/GitVersion.Tool/6.5.1
          key: ${{ runner.os }}-${{ runner.arch }}-gitversion-tool-6.5.1
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.5.1'
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml
      - name: Restore locked solution packages
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./eng/src/agent-scripts/RepositoryAutomation.psm1 -Force
          Invoke-RepositoryProcess -FilePath dotnet -Arguments @('restore', $env:SOLUTION, '--locked-mode') | Out-Host
      - name: Build solution once for L0-L2
        env:
          BUILD_VERSION: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./eng/src/agent-scripts/RepositoryAutomation.psm1 -Force
          Invoke-SolutionBuild -SolutionPath $env:SOLUTION -Configuration $env:CONFIGURATION -NoRestore -NoIncremental -WarnAsError -AdditionalArguments "-p:Version=$env:BUILD_VERSION" | Out-Host
      - name: Run L0
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./eng/src/agent-scripts/RepositoryAutomation.psm1 -Force
          Invoke-SolutionTests -SolutionPath $env:SOLUTION -Configuration $env:CONFIGURATION -TestLevels L0Tests -AdditionalArguments '--no-build' -ResultsRoot artifacts/ci-benchmark/test-results | Out-Host
      - name: Discover and run L1
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./eng/src/agent-scripts/RepositoryAutomation.psm1 -Force
          $projects = @(Get-TestProjects -SolutionPath $env:SOLUTION | Where-Object { $_ -match '\.L1Tests\.csproj$' })
          if ($projects.Count -eq 0) {
            $message = "L1 is not applicable: $env:SOLUTION declares no L1 test projects."
            Write-Host $message
            $message | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          Invoke-SolutionTests -SolutionPath $env:SOLUTION -Configuration $env:CONFIGURATION -TestLevels L1Tests -AdditionalArguments '--no-build' -ResultsRoot artifacts/ci-benchmark/test-results | Out-Host
      - name: Cache versioned Aspire CLI
        id: aspire
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tools/aspire-${{ steps.inventory.outputs.aspire-version }}
          key: ${{ runner.os }}-${{ runner.arch }}-aspire-${{ steps.inventory.outputs.aspire-version }}-sdk-${{ steps.inventory.outputs.sdk }}
      - name: Restore tools and verify local Aspire CLI
        env:
          ASPIRE_VERSION: ${{ steps.inventory.outputs.aspire-version }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./eng/src/agent-scripts/RepositoryAutomation.psm1 -Force
          Invoke-DotnetToolRestore -RepoRoot $env:GITHUB_WORKSPACE
          $toolPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/tools/aspire-$env:ASPIRE_VERSION"
          $aspire = Join-Path $toolPath 'aspire'
          if (-not (Test-Path -LiteralPath $aspire -PathType Leaf)) {
            Invoke-RepositoryProcess -FilePath dotnet -Arguments @('tool', 'install', 'Aspire.Cli', '--version', $env:ASPIRE_VERSION, '--tool-path', $toolPath) | Out-Host
          }
          $installedVersion = (Invoke-RepositoryProcess -FilePath $aspire -Arguments @('--version') | Out-String).Trim()
          if ($installedVersion.Split('+')[0] -ne $env:ASPIRE_VERSION) { throw "Expected Aspire CLI $env:ASPIRE_VERSION; found $installedVersion." }
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Run L2
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./eng/src/agent-scripts/RepositoryAutomation.psm1 -Force
          Invoke-SolutionTests -SolutionPath $env:SOLUTION -Configuration $env:CONFIGURATION -TestLevels L2Tests -AdditionalArguments '--no-build' -ResultsRoot artifacts/ci-benchmark/test-results | Out-Host
      - name: Run Spring L3 with canonical restore and build
        env:
          SPRING_TEST_SUITE: ${{ inputs.suite || 'Smoke' }}
        run: ./test-spring.ps1 -TestLevel L3 -Suite $env:SPRING_TEST_SUITE -Configuration $env:CONFIGURATION -InstallBrowserDependencies
      - name: Publish cache observations
        if: always()
        env:
          NUGET_CACHE_HIT: ${{ steps.nuget.outputs.cache-hit }}
          GITVERSION_CACHE_HIT: ${{ steps.gitversion-cache.outputs.cache-hit }}
          ASPIRE_CACHE_HIT: ${{ steps.aspire.outputs.cache-hit }}
        run: |
          "NuGet cache hit: $env:NUGET_CACHE_HIT; GitVersion cache hit: $env:GITVERSION_CACHE_HIT; Aspire cache hit: $env:ASPIRE_CACHE_HIT" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Retain benchmark and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Samples-validation-${{ github.run_attempt }}
          path: |
            artifacts/ci-benchmark/
            artifacts/spring/
          if-no-files-found: error
          retention-days: 7

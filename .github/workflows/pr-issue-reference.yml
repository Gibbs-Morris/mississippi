name: PR Issue Reference

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  validate-issue-reference:
    name: Validate repository issue reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target and merge_group must execute only trusted default-branch code.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate pull request issue reference
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          $validator = './eng/src/agent-scripts/validate-pr-issue-reference.ps1'
          $mergeValidator = './eng/src/agent-scripts/validate-merge-group-pr-issue-reference.ps1'
          $repository = $env:GITHUB_REPOSITORY
          $targetSha = if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') { $env:PR_HEAD_SHA } else { $env:GITHUB_SHA }
          $state = 'failure'
          $description = 'Pull request issue-reference validation failed.'
          try {
            if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') {
              $output = & pwsh -NoProfile -File $validator -Body $env:PR_BODY -RepositoryOwner $env:REPOSITORY_OWNER -RepositoryName $env:REPOSITORY_NAME -Json 2>&1 | Out-String
              Write-Output $output
              if ($LASTEXITCODE -ne 0) { throw 'Pull request issue-reference validation failed.' }
            }
            else {
              $pullRequestsPath = Join-Path $env:RUNNER_TEMP 'merge-group-pull-requests.json'
              gh api "repos/$repository/commits/$env:GITHUB_SHA/pulls" --header 'Accept: application/vnd.github+json' --paginate --slurp | Set-Content -LiteralPath $pullRequestsPath -Encoding utf8
              if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve merge-group pull requests.' }
              $output = & pwsh -NoProfile -File $mergeValidator -PullRequestsPath $pullRequestsPath -RepositoryOwner $env:REPOSITORY_OWNER -RepositoryName $env:REPOSITORY_NAME 2>&1 | Out-String
              Write-Output $output
              if ($LASTEXITCODE -ne 0) { throw 'Merge-group issue-reference validation failed.' }
            }
            $state = 'success'
            $description = 'Repository issue-reference validation passed.'
          }
          catch {
            Write-Error $_.Exception.Message
            throw
          }
          finally {
            $statusOutput = gh api --method POST "repos/$repository/statuses/$targetSha" -f state=$state -f context='PR Issue Reference' -f description=$description -f target_url="$env:GITHUB_SERVER_URL/$repository/actions/runs/$env:GITHUB_RUN_ID" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Unable to publish PR Issue Reference status: $($statusOutput.Trim())"
              if ($state -eq 'success') { throw 'Required PR Issue Reference status could not be published.' }
            }
          }

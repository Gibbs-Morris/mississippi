name: PR Issue Reference

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-issue-reference:
    name: Validate repository issue reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target and merge_group must execute only trusted default-branch code.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate pull request issue reference
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          $validator = './eng/src/agent-scripts/validate-pr-issue-reference.ps1'
          $repository = $env:GITHUB_REPOSITORY
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') {
            $output = & pwsh -NoProfile -File $validator -Body $env:PR_BODY -RepositoryOwner $env:REPOSITORY_OWNER -RepositoryName $env:REPOSITORY_NAME -Json 2>&1 | Out-String
            Write-Output $output
            if ($LASTEXITCODE -ne 0) { throw 'Pull request issue-reference validation failed.' }
            exit 0
          }

          $pages = @(gh api "repos/$repository/commits/$env:GITHUB_SHA/pulls" --header 'Accept: application/vnd.github+json' --paginate --slurp | ConvertFrom-Json)
          $pullRequests = @($pages | ForEach-Object { @($_) })
          if ($pullRequests.Count -eq 0) { throw 'Merge-group issue-reference validation could not resolve any constituent pull requests.' }
          foreach ($pullRequest in $pullRequests) {
            Write-Host "Validating merge-group pull request #$($pullRequest.number)"
            $output = & pwsh -NoProfile -File $validator -Body ([string]$pullRequest.body) -RepositoryOwner $env:REPOSITORY_OWNER -RepositoryName $env:REPOSITORY_NAME -Json 2>&1 | Out-String
            Write-Output $output
            if ($LASTEXITCODE -ne 0) { throw "Pull request issue-reference validation failed for #$($pullRequest.number)." }
          }

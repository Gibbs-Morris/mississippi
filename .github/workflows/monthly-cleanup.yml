name: Monthly ReSharper Cleanup

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: monthly-resharper-cleanup
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  CLEANUP_PR_TITLE: 'Apply monthly ReSharper cleanup drift +semver: skip'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/packages.*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache JetBrains analysis data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.jb-caches
          key: jb-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.editorconfig', '**/*.DotSettings', '**/Directory.Build.props', '**/Directory.Build.targets', 'mississippi.slnx', 'samples.slnx') }}
          restore-keys: |
            jb-${{ runner.os }}-

      - name: Run full canonical cleanup
        shell: pwsh
        env:
          CACHE_HOME: ${{ runner.temp }}/.jb-caches
        run: |
          ./clean-up.ps1 `
            -Configuration $env:CONFIGURATION `
            -CachesHome $env:CACHE_HOME `
            -NoUpdates
          if ($LASTEXITCODE -ne 0) {
            throw 'Monthly canonical cleanup failed.'
          }

      - name: Create or reuse cleanup pull request
        id: pull-request
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add --all -- . ':(exclude,glob)**/packages*.lock.json'

          $search = '"' + $env:CLEANUP_PR_TITLE + '" in:title'
          $pullRequestJson = gh pr list `
            --base $env:DEFAULT_BRANCH `
            --state open `
            --search $search `
            --limit 1000 `
            --json number,title,headRefName,url,isCrossRepository,headRepositoryOwner
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to check for an existing monthly cleanup pull request.'
          }

          $existingPullRequests = @(
            ($pullRequestJson | ConvertFrom-Json) |
              Where-Object {
                $_.title -eq $env:CLEANUP_PR_TITLE -and
                $_.headRefName -like 'automation/monthly-cleanup-*' -and
                -not ([bool]$_.isCrossRepository) -and
                [string]$_.headRepositoryOwner.login -eq $env:REPOSITORY_OWNER
              }
          )
          $existing = $existingPullRequests | Select-Object -First 1

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No cleanup drift detected.'
            if ($null -ne $existing) {
              gh pr close $existing.number `
                --comment 'Closing this automation PR because the current default branch no longer has cleanup drift.' `
                --delete-branch
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to close stale monthly cleanup PR #$($existing.number)."
              }
              Write-Host "Closed stale monthly cleanup PR #$($existing.number)."
            }
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw 'Unable to inspect cleanup drift.'
          }

          $stagedFiles = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to list cleanup drift files.'
          }

          if ($null -ne $existing) {
            $existingBranch = [string]$existing.headRefName
            if ([string]::IsNullOrWhiteSpace($existingBranch)) {
              throw "Existing cleanup pull request #$($existing.number) does not expose a head branch."
            }

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --message $env:CLEANUP_PR_TITLE
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to commit monthly cleanup drift before updating the existing pull request.'
            }
            $cleanupCommit = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($cleanupCommit)) {
              throw 'Unable to resolve the monthly cleanup commit.'
            }

            $remoteTrackingRef = "refs/remotes/origin/$existingBranch"
            git fetch --no-tags origin "refs/heads/$($existingBranch):$remoteTrackingRef"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch the existing cleanup branch '$existingBranch'."
            }
            $expectedRemoteSha = (git rev-parse $remoteTrackingRef).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expectedRemoteSha)) {
              throw "Unable to resolve the existing cleanup branch '$existingBranch'."
            }

            $lease = "refs/heads/$($existingBranch):$expectedRemoteSha"
            git push `
              --force-with-lease=$lease `
              origin `
              "$($cleanupCommit):refs/heads/$existingBranch"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to push updated cleanup branch '$existingBranch'."
            }

            $body = "Automated monthly full-repository ReSharper cleanup found current drift in $($stagedFiles.Count) file(s)."
            gh pr edit $existing.number --body $body
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to update monthly cleanup PR #$($existing.number)."
            }

            "branch=$existingBranch" >> $env:GITHUB_OUTPUT
            Write-Host "Updated existing cleanup PR #$($existing.number): $($existing.url)"
            exit 0
          }

          $branchName = "automation/monthly-cleanup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create $branchName
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create cleanup branch '$branchName'."
          }

          git commit --message $env:CLEANUP_PR_TITLE
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to commit monthly cleanup drift.'
          }
          git push --set-upstream origin $branchName
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to push cleanup branch '$branchName'."
          }

          $body = "Automated monthly full-repository ReSharper cleanup found drift in $($stagedFiles.Count) file(s)."
          gh pr create `
            --base $env:DEFAULT_BRANCH `
            --head $branchName `
            --title $env:CLEANUP_PR_TITLE `
            --body $body
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to create the monthly cleanup pull request.'
          }

          "branch=$branchName" >> $env:GITHUB_OUTPUT

      - name: Trigger cleanup pull request validation
        if: steps.pull-request.outputs.branch != ''
        shell: pwsh
        env:
          CLEANUP_BRANCH: ${{ steps.pull-request.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $workflows = @(
            'aspire-locked-restore.yml',
            'cleanup.yml',
            'docusaurus.yml',
            'full-build.yml',
            'l0-tests.yml',
            'l1-tests.yml',
            'l2-tests.yml',
            'markdown-lint.yml',
            'powershell-tests.yml',
            'project-reference-hygiene-gate.yml',
            'sonar-cloud.yml',
            'src-csproj-description-check.yml'
          )

          foreach ($workflow in $workflows) {
            gh workflow run $workflow --ref $env:CLEANUP_BRANCH
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to dispatch '$workflow' for cleanup branch '$env:CLEANUP_BRANCH'."
            }
          }

          Write-Host "Dispatched $($workflows.Count) validation workflows for '$env:CLEANUP_BRANCH'."

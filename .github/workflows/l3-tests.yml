name: L3 Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Spring L3 browser suite
        type: choice
        options: [Smoke, Full]
        default: Smoke
  merge_group:
  pull_request:
    branches: [main, 'feature/**', 'topic/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spring-l3:
    name: L3 Spring E2E (${{ inputs.suite || 'Smoke' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SPRING_TEST_SUITE: ${{ inputs.suite || 'Smoke' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
            artifacts/tools
          key: spring-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json') }}
      - name: Run Spring L3 browser tests
        shell: pwsh
        run: ./test-spring.ps1 -TestLevel L3 -Suite $env:SPRING_TEST_SUITE -InstallBrowserDependencies
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spring-l3-${{ inputs.suite || 'Smoke' }}-${{ runner.os }}
          path: artifacts/spring/
          if-no-files-found: error
          retention-days: 7

name: Weekly ReSharper Cleanup

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-resharper-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools and packages
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore mississippi.slnx
          dotnet restore samples.slnx

      - name: Run full repository cleanup
        shell: pwsh
        run: ./clean-up.ps1

      - name: Create cleanup pull request
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add --all -- . ':(exclude,glob)**/packages*.lock.json'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No cleanup drift detected."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Unable to inspect cleanup changes."
          }

          $branchName = "automation/weekly-cleanup-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create $branchName
          git commit --message "Apply weekly cleanup drift +semver: skip"
          git push --set-upstream origin $branchName

          gh pr create `
            --base $env:DEFAULT_BRANCH `
            --head $branchName `
            --title "Apply weekly cleanup drift +semver: skip" `
            --body "Automated full-repository cleanup found and applied formatting drift."

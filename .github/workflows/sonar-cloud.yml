name: SonarCloud
on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    branches:
      - main
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/**
      - topic/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SONAR_PROJECT_KEY: "Gibbs-Morris_mississippi"
  SONAR_ORGANIZATION: "gibbs-morris"
  SONAR_HOST_URL: "https://sonarcloud.io"
  CONFIGURATION: Release
  SOLUTION_PATH: ${{ github.workspace }}/mississippi.slnx
jobs:
  Build:
    name: "Build"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - name: Validate merge-group origins
        id: merge-group-origin
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Run this before checkout so fork-controlled code cannot alter the origin gate.
          if [[ "$BASE_REF" != "refs/heads/main" ]]; then
            echo "::error::Sonar merge-group analysis only supports the main branch."
            exit 1
          fi

          if [[ ! "$QUEUE_HEAD_REF" =~ ^refs/heads/gh-readonly-queue/main/pr-([0-9]+)(-|$) ]]; then
            echo "::error::Cannot identify the pull request at the head of this merge group; Sonar credentials will not be used."
            exit 1
          fi
          current_pr="${BASH_REMATCH[1]}"

          IFS='/' read -r owner repository_name <<< "$REPOSITORY"
          if [[ -z "$owner" || -z "$repository_name" || "$repository_name" == */* ]]; then
            echo "::error::Cannot identify the repository for merge-group origin validation."
            exit 1
          fi

          query='query($owner: String!, $name: String!, $branch: String!, $endCursor: String) {
            repository(owner: $owner, name: $name) {
              mergeQueue(branch: $branch) {
                entries(first: 100, after: $endCursor) {
                  nodes {
                    position
                    pullRequest {
                      number
                      headRepository { nameWithOwner }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }'
          queue_pages="$(gh api graphql --paginate \
            -f query="$query" \
            -F owner="$owner" \
            -F name="$repository_name" \
            -F branch="main")"
          queue_json="$(jq -s '
            if any(.[]; .data.repository.mergeQueue == null) then
              error("The main merge queue is unavailable")
            else
              { entries: [ .[].data.repository.mergeQueue.entries.nodes[] ] }
            end
          ' <<< "$queue_pages")"

          current_position="$(jq -r --argjson pr "$current_pr" \
            '[.entries[] | select(.pullRequest.number == $pr) | .position] | if length == 1 then .[0] else empty end' \
            <<< "$queue_json")"
          if [[ -z "$current_position" ]]; then
            echo "::error::The pull request at the merge-group head is not in the main queue; Sonar credentials will not be used."
            exit 1
          fi

          # A later merge-group ref may include every queued entry ahead of it.
          untrusted_positions="$(jq -r \
            --arg repository "$REPOSITORY" \
            --argjson current_position "$current_position" \
            '.entries[]
             | select(.position <= $current_position)
             | select(((.pullRequest.headRepository.nameWithOwner // "") | ascii_downcase) != ($repository | ascii_downcase))
             | .position' <<< "$queue_json")"
          if [[ -n "$untrusted_positions" ]]; then
            echo "::error::This merge group contains pull request(s) from outside $REPOSITORY; Sonar credentials are withheld."
            exit 1
          fi

          echo "Verified that every pull request up to the merge-group head originates from $REPOSITORY."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache GitVersion tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gitversion
          key: ${{ runner.os }}-gitversion
          restore-keys: ${{ runner.os }}-gitversion

      - name: Cache nugets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: Cache Sonar Cloud Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Cache Sonar Cloud Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: |
            ${{ runner.os }}-sonar-scanner

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.5.1"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: "GitVersion.yml"

      - name: Setup Java for Sonar Scanner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: microsoft
          java-version: "21"

      - name: Restore dotnet tools & packages
        run: |
          dotnet tool restore
          true

      - name: Sonar restore-build-report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "branch" || -z "$GITHUB_REF_NAME" ]]; then
              echo "::error::Merge-group analysis requires a branch ref."
              exit 1
            fi

            # Analyze the exact candidate as a short-lived branch targeting main.
            set -- "/d:sonar.branch.name=$GITHUB_REF_NAME" "/d:sonar.branch.target=main" "/d:sonar.qualitygate.wait=true"
          else
            set --
          fi

          dotnet dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECT_KEY }}" /o:"${{ env.SONAR_ORGANIZATION }}" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" /v:${{ steps.gitversion.outputs.SemVer }} /d:"sonar.cs.vscoveragexml.reportsPaths=coverage.xml" /d:sonar.exclusions="**/*.lock.json, **/*.DotSettings,**/packages.lock.json,docs/**" /d:sonar.cpd.exclusions="**/Inlet.Client.Generators/**,**/Inlet.Gateway.Generators/**,**/Inlet.Runtime.Generators/**,**/setup.ps1,**/Setup.Tests.ps1,**/AgentDoctor.Tests.ps1" /d:sonar.issue.ignore.multicriteria=s107 /d:sonar.issue.ignore.multicriteria.s107.ruleKey=csharpsquid:S107 /d:sonar.issue.ignore.multicriteria.s107.resourceKey='**/*.cs' "$@"

          dotnet restore ${{ env.SOLUTION_PATH }}
          dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-restore --no-incremental -p:Version=${{ steps.gitversion.outputs.SemVer }}

          dotnet dotnet-coverage collect "pwsh -NoProfile -File ./eng/src/agent-scripts/test-solution.ps1 -SolutionPath ${{ env.SOLUTION_PATH }} -Configuration ${{ env.CONFIGURATION }} -NoBuild" -f xml -o "coverage.xml"

          dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"


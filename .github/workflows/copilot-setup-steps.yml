name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - setup.ps1
      - eng/src/agent-scripts/AgentDoctor.psm1
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - setup.ps1
      - eng/src/agent-scripts/AgentDoctor.psm1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache npm and NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.nuget/packages
          key: ${{ runner.os }}-agent-setup-${{ hashFiles('**/package-lock.json', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-agent-setup-

      - name: Run canonical shared setup
        shell: pwsh
        run: ./setup.ps1 -Profile CoreDocs -InstallPester -NonInteractive

# Release publishing - triggers on release/** branches only
name: NuGet Release

on:
  push:
    branches:
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release

jobs:
  build-pack:
    name: Build and Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache GitVersion tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gitversion
          key: ${{ runner.os }}-gitversion
          restore-keys: ${{ runner.os }}-gitversion

      - name: Cache nugets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.5.1"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          useConfigFile: true

      - name: Print resolved version
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
          FULLSEMVER: ${{ steps.gitversion.outputs.FullSemVer }}
        run: |
          echo "GitVersion SemVer: $SEMVER"
          echo "GitVersion FullSemVer: $FULLSEMVER"

      - name: Ensure stable release version
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          if [[ "$SEMVER" == *-* ]]; then
            echo "Release workflow requires a stable SemVer without prerelease suffix, but got: $SEMVER"
            exit 1
          fi
          echo "Stable SemVer verified: $SEMVER"

      - name: Restore
        run: dotnet restore ${{ github.workspace }}/mississippi.slnx

      - name: Build
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: dotnet build ${{ github.workspace }}/mississippi.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --no-incremental -warnaserror -p:Version="$SEMVER"

      - name: Test (L0/L1)
        run: dotnet test ${{ github.workspace }}/mississippi.slnx --configuration ${{ env.CONFIGURATION }} --no-build --no-restore --filter "FullyQualifiedName~.L0Tests.|FullyQualifiedName~.L1Tests."

      - name: Pack
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          dotnet pack ${{ github.workspace }}/mississippi.slnx \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ${{ github.workspace }}/artifacts/nuget \
            -p:PackageVersion="$SEMVER"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-${{ steps.gitversion.outputs.SemVer }}
          path: artifacts/nuget/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet (Release)
    runs-on: ubuntu-latest
    needs: build-pack
    permissions:
      contents: read
      id-token: write
    environment: nuget-release

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/nuget

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          # Only push symbol packages if they exist
          if compgen -G "artifacts/nuget/*.snupkg" > /dev/null; then
            dotnet nuget push "artifacts/nuget/*.snupkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi

      - name: Publish summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "## NuGet Publish Summary (Release)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** \`nuget-release\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`$BRANCH_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for pkg in artifacts/nuget/*.nupkg; do
            [ -f "$pkg" ] && echo "- \`$(basename "$pkg")\`" >> "$GITHUB_STEP_SUMMARY"
          done
          for pkg in artifacts/nuget/*.snupkg; do
            [ -f "$pkg" ] && echo "- \`$(basename "$pkg")\`" >> "$GITHUB_STEP_SUMMARY"
          done

name: ReSharper Cleanup Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/**
      - topic/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTSETTINGS_PATH: ${{ github.workspace }}/Directory.DotSettings
  CONFIGURATION: Release

jobs:
  cleanup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        solution: [ mississippi.slnx, samples.slnx ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed-files
        shell: pwsh
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          $baseRef = "origin/$env:BASE_BRANCH"
          $fileList = Join-Path $env:RUNNER_TEMP "cleanup-changed-files.txt"
          $changedFiles = @(git diff --name-only --diff-filter=ACMR "$baseRef...HEAD")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to determine changed files relative to $baseRef."
          }

          Set-Content -LiteralPath $fileList -Value $changedFiles
          "file_list=$fileList" >> $env:GITHUB_OUTPUT
          Write-Host "Found $($changedFiles.Count) changed file(s) relative to $baseRef."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache GitVersion tools
        uses: actions/cache@v4
        with:
          path: ~/.gitversion
          key: ${{ runner.os }}-gitversion
          restore-keys: ${{ runner.os }}-gitversion

      - name: Cache nugets
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/packages.*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/packages.*.lock.json') }}

      - name: Cache JetBrains analysis caches
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.jb-caches
          key: jb-${{ runner.os }}-${{ matrix.solution }}-${{ hashFiles('**/*.slnx', '**/*.csproj', '**/*.editorconfig', '**/*.DotSettings', '**/Directory.Build.props') }}
          restore-keys: |
            jb-${{ runner.os }}-${{ matrix.solution }}-
            jb-${{ runner.os }}-

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: "6.0.5"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.2.1
        with:
          useConfigFile: true

      - name: Restore dotnet packages
        run: |
          dotnet restore ${{ github.workspace }}/${{ matrix.solution }}

      - name: Build dotnet projects
        run: |
          dotnet build ${{ github.workspace }}/${{ matrix.solution }} --configuration ${{ env.CONFIGURATION }} --no-restore --no-incremental -warnaserror -p:Version=${{ steps.gitversion.outputs.SemVer }}

      - name: Check for dotnet tools manifest
        id: check-tools-manifest
        shell: pwsh
        run: |
          if (Test-Path ".config/dotnet-tools.json") {
            echo "manifest_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "manifest_exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Restore .NET Tools
        if: steps.check-tools-manifest.outputs.manifest_exists == 'true'
        shell: pwsh
        run: |
          Write-Host "Restoring dotnet tools..."
          dotnet tool restore
        continue-on-error: false

      - name: Install ReSharper Global Tools
        if: steps.check-tools-manifest.outputs.manifest_exists != 'true'
        shell: pwsh
        run: |
          Write-Host "Installing JetBrains.ReSharper.GlobalTools..."
          dotnet tool install -g JetBrains.ReSharper.GlobalTools
        continue-on-error: false

      - name: Run ReSharper Cleanup Code on changed files
        shell: pwsh
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $fileList = "${{ steps.changed-files.outputs.file_list }}"
          if ("${{ matrix.solution }}" -eq "samples.slnx") {
            ./clean-up-targeted.ps1 -FileListPath $fileList -SkipMississippi
          } else {
            ./clean-up-targeted.ps1 -FileListPath $fileList -SkipSamples
          }
          $stopwatch.Stop()
          $elapsed = $stopwatch.Elapsed
          Write-Host ""
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "CLEANUP TIMING SUMMARY" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Solution: ${{ matrix.solution }}"
          Write-Host "Duration: $($elapsed.ToString('hh\:mm\:ss\.fff'))"
          Write-Host "Minutes:  $([math]::Round($elapsed.TotalMinutes, 2))"
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Cleanup completed."

      - name: Check for Uncommitted Changes
        shell: pwsh
        run: |
          Write-Host "Checking for modifications after cleanup..."
          # Exclude packages lock files as Aspire dependencies may differ between platforms
          # Matches both packages.lock.json and OS-specific variants like packages.linux-x64.lock.json
          $changes = git status --porcelain | Where-Object { $_ -notmatch 'packages.*\.lock\.json$' }
          if ($changes) {
            Write-Host "ERROR: ReSharper cleanup modified files. The following changes are required:"
            git diff --color=always -- . ':!**/packages*.lock.json'
            Write-Host ""
            Write-Host "To resolve this locally run:"
            Write-Host "Run the following from the repository root:"
            Write-Host "pwsh ./clean-up-targeted.ps1"
            exit 1
          } else {
            Write-Host "No modifications detected. Cleanup check passed."
          }

name: ReSharper Cleanup Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/**
      - topic/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONFIGURATION: Release

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect PR changed files
        id: detect
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or [string]::IsNullOrWhiteSpace($env:HEAD_SHA)) {
            throw 'The pull request base/head SHAs are required for cleanup scope detection.'
          }

          foreach ($sha in @($env:BASE_SHA, $env:HEAD_SHA)) {
            git cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git fetch --no-tags origin $sha
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to fetch commit '$sha' required for cleanup scope detection."
              }
            }
          }

          $fileList = Join-Path $env:RUNNER_TEMP 'cleanup-pr-files.txt'
          $changedFiles = @(git diff --name-only --diff-filter=ACMRD "$($env:BASE_SHA)...$($env:HEAD_SHA)")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to calculate the PR delta between '$($env:BASE_SHA)' and '$($env:HEAD_SHA)'."
          }

          New-Item -ItemType File -Path $fileList -Force | Out-Null
          if ($changedFiles.Count -gt 0) {
            Set-Content -LiteralPath $fileList -Value $changedFiles -Encoding utf8NoBOM
          }

          "run_mode=targeted" >> $env:GITHUB_OUTPUT
          "file_list=$fileList" >> $env:GITHUB_OUTPUT
          "base_sha=$env:BASE_SHA" >> $env:GITHUB_OUTPUT
          "head_sha=$env:HEAD_SHA" >> $env:GITHUB_OUTPUT
          "changed_count=$($changedFiles.Count)" >> $env:GITHUB_OUTPUT
          Write-Host "Cleanup base SHA: $env:BASE_SHA"
          Write-Host "Cleanup head SHA: $env:HEAD_SHA"
          Write-Host "Total PR changed files: $($changedFiles.Count)"

      - name: Select full cleanup for manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          "run_mode=full" >> $env:GITHUB_OUTPUT
          Write-Host 'Manual dispatch selects full repository cleanup.'

      - name: Plan targeted cleanup
        id: plan
        if: steps.detect.outputs.run_mode == 'targeted'
        shell: pwsh
        env:
          FILE_LIST: ${{ steps.detect.outputs.file_list }}
        run: |
          $planJson = @(./clean-up.ps1 -FileListPath $env:FILE_LIST -PlanOnly)
          if ($LASTEXITCODE -ne 0) {
            throw 'Cleanup preflight planning failed.'
          }
          $plan = ($planJson -join "`n") | ConvertFrom-Json
          "mode=$($plan.Mode)" >> $env:GITHUB_OUTPUT
          "eligible_count=$($plan.EligiblePaths.Count)" >> $env:GITHUB_OUTPUT
          "ignored_count=$($plan.IgnoredPaths.Count)" >> $env:GITHUB_OUTPUT
          "affected_projects=$((@($plan.AffectedProjects) -join ', '))" >> $env:GITHUB_OUTPUT

          Write-Host "Cleanup-eligible files: $($plan.EligiblePaths.Count)"
          Write-Host "Ignored files: $($plan.IgnoredPaths.Count)"
          Write-Host "Selected execution mode: $($plan.Mode)"
          if ($plan.FallbackReasons.Count -gt 0) {
            Write-Host "Fallback reasons: $($plan.FallbackReasons -join ' | ')" -ForegroundColor Yellow
          }
          if ($plan.AffectedProjects.Count -gt 0) {
            Write-Host "Affected projects: $($plan.AffectedProjects -join ', ')"
          }

      - name: Setup .NET
        if: steps.manual.outputs.run_mode == 'full' || steps.plan.outputs.mode != 'NoOp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.manual.outputs.run_mode == 'full' || steps.plan.outputs.mode != 'NoOp'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: Cache JetBrains analysis data
        if: steps.manual.outputs.run_mode == 'full' || steps.plan.outputs.mode != 'NoOp'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.jb-caches
          key: jb-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.editorconfig', '**/*.DotSettings', '**/Directory.Build.props', '**/Directory.Build.targets', 'mississippi.slnx', 'samples.slnx') }}
          restore-keys: |
            jb-${{ runner.os }}-

      - name: Run canonical cleanup
        if: steps.manual.outputs.run_mode == 'full' || steps.plan.outputs.mode != 'NoOp'
        shell: pwsh
        env:
          FILE_LIST: ${{ steps.detect.outputs.file_list }}
          RUN_MODE: ${{ steps.manual.outputs.run_mode || steps.detect.outputs.run_mode }}
          CACHE_HOME: ${{ runner.temp }}/.jb-caches
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          if ($env:RUN_MODE -eq 'full') {
            ./clean-up.ps1 `
              -Configuration $env:CONFIGURATION `
              -CachesHome $env:CACHE_HOME `
              -NoUpdates
          } else {
            ./clean-up.ps1 `
              -Configuration $env:CONFIGURATION `
              -FileListPath $env:FILE_LIST `
              -CachesHome $env:CACHE_HOME `
              -NoUpdates
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Canonical cleanup failed.'
          }
          $stopwatch.Stop()
          Write-Host "Cleanup elapsed time: $($stopwatch.Elapsed.ToString('hh\:mm\:ss\.fff'))"

      - name: Check for cleanup changes
        if: steps.manual.outputs.run_mode == 'full' || steps.plan.outputs.mode != 'NoOp'
        shell: pwsh
        env:
          FILE_LIST: ${{ steps.detect.outputs.file_list }}
          RUN_MODE: ${{ steps.manual.outputs.run_mode || steps.detect.outputs.run_mode }}
        run: |
          $trackedChanges = @(git diff --name-only HEAD -- . ':!**/packages*.lock.json')
          $untrackedChanges = @(
            git ls-files --others --exclude-standard -- . |
              Where-Object { $_ -notmatch '(?i)packages(?:\.[^/\\]+)?\.lock\.json$' }
          )
          $changes = @($trackedChanges + $untrackedChanges | Sort-Object -Unique)
          if ($changes.Count -eq 0) {
            Write-Host 'No cleanup changes detected.'
            exit 0
          }

          if ($env:RUN_MODE -eq 'targeted' -and $env:FILE_LIST -and (Test-Path -LiteralPath $env:FILE_LIST)) {
            $prChangedPaths = @(
              Get-Content -LiteralPath $env:FILE_LIST -Encoding UTF8 |
                ForEach-Object { $_.Trim() } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                Sort-Object -Unique
            )
            $prChangedSet = [System.Collections.Generic.HashSet[string]]::new(
              [System.StringComparer]::OrdinalIgnoreCase
            )
            foreach ($path in $prChangedPaths) {
              $normalizedPath = $path -replace '\\', '/'
              $null = $prChangedSet.Add($normalizedPath)
            }

            $prChanges = @(
              $changes | Where-Object {
                $normalizedPath = $_ -replace '\\', '/'
                $prChangedSet.Contains($normalizedPath)
              }
            )
            $unrelatedChanges = @(
              $changes | Where-Object {
                $normalizedPath = $_ -replace '\\', '/'
                -not $prChangedSet.Contains($normalizedPath)
              }
            )

            if ($unrelatedChanges.Count -gt 0) {
              Write-Warning "Full-fallback cleanup found $($unrelatedChanges.Count) pre-existing drift file(s) outside the PR change set. The monthly full-cleanup workflow owns this drift."
              $unrelatedChanges | ForEach-Object { Write-Host "  Drift: $_" -ForegroundColor Yellow }
            }

            if ($prChanges.Count -gt 0) {
              Write-Host 'ERROR: ReSharper cleanup changed files from the PR change set:'
              git diff --color=always -- $prChanges
              Write-Host ''
              Write-Host 'Reproduce locally with:'
              Write-Host 'pwsh ./clean-up.ps1 -FileListPath <changed-files.txt>'
              exit 1
            }

            Write-Host 'No PR-owned cleanup changes detected.'
            exit 0
          }

          Write-Host 'ERROR: ReSharper cleanup changed tracked cleanup-owned files:'
          git diff --color=always -- . ':!**/packages*.lock.json'
          Write-Host ''
          Write-Host 'Reproduce locally with:'
          Write-Host 'pwsh ./clean-up.ps1'
          exit 1

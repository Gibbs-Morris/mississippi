name: ReSharper Cleanup Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/**
      - topic/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTSETTINGS_PATH: ${{ github.workspace }}/Directory.DotSettings
  CONFIGURATION: Release

jobs:
  cleanup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        solution: [ mississippi.slnx, samples.slnx ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache GitVersion tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gitversion
          key: ${{ runner.os }}-gitversion
          restore-keys: ${{ runner.os }}-gitversion

      - name: Cache nugets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: Cache JetBrains analysis caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.jb-caches
          key: jb-${{ runner.os }}-${{ matrix.solution }}-${{ hashFiles('**/*.slnx', '**/*.csproj', '**/*.editorconfig', '**/*.DotSettings', '**/Directory.Build.props') }}
          restore-keys: |
            jb-${{ runner.os }}-${{ matrix.solution }}-
            jb-${{ runner.os }}-

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.5.1"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: "GitVersion.yml"

      - name: Restore dotnet packages
        run: |
          dotnet restore ${{ github.workspace }}/${{ matrix.solution }}

      - name: Build dotnet projects
        run: |
          dotnet build ${{ github.workspace }}/${{ matrix.solution }} --configuration ${{ env.CONFIGURATION }} --no-restore --no-incremental -warnaserror -p:Version=${{ steps.gitversion.outputs.SemVer }}

      - name: Check for dotnet tools manifest
        id: check-tools-manifest
        shell: pwsh
        run: |
          if (Test-Path ".config/dotnet-tools.json") {
            echo "manifest_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "manifest_exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Restore .NET Tools
        if: steps.check-tools-manifest.outputs.manifest_exists == 'true'
        shell: pwsh
        run: |
          Write-Host "Restoring dotnet tools..."
          dotnet tool restore
        continue-on-error: false

      - name: Install ReSharper Global Tools
        if: steps.check-tools-manifest.outputs.manifest_exists != 'true'
        shell: pwsh
        run: |
          Write-Host "Installing JetBrains.ReSharper.GlobalTools..."
          dotnet tool install -g JetBrains.ReSharper.GlobalTools
        continue-on-error: false

      - name: Generate legacy solution file
        shell: pwsh
        run: |
          $slnxPath = Join-Path "${{ github.workspace }}" "${{ matrix.solution }}"
          $slnPath = $slnxPath -replace '\.slnx$', '.sln'
          Write-Host "Generating $slnPath from $slnxPath ..."
          dotnet tool run slngen "$slnxPath" --solutionfile "$slnPath" --launch false
          Get-Item "$slnPath" | Format-List

      - name: Run ReSharper Cleanup Code
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $slnxPath = Join-Path "${{ github.workspace }}" "${{ matrix.solution }}"
          $slnPath = $slnxPath -replace '\.slnx$', '.sln'
          echo "SLN_PATH=$slnPath" >> $env:GITHUB_ENV
          $slnFileName = Split-Path -Path $slnPath -Leaf
          echo "SLN_FILE_NAME=$slnFileName" >> $env:GITHUB_ENV

          $cleanupArguments = @(
            'tool', 'run', 'jb', 'cleanupcode',
            '--profile=Built-in: Full Cleanup',
            "--settings=${{ env.DOTSETTINGS_PATH }}",
            "--caches-home=${{ runner.temp }}/.jb-caches",
            '--no-updates',
            $slnPath,
            '--LogLevel=TRACE'
          )

          # Gate only PR-changed files, even when formatting settings change, to avoid
          # unrelated cleanup churn. Manual runs provide full-solution cleanup checks.
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $eventPayload = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $baseSha = $eventPayload.pull_request.base.sha
            $headSha = $eventPayload.pull_request.head.sha
            if ([string]::IsNullOrWhiteSpace($baseSha) -or [string]::IsNullOrWhiteSpace($headSha)) {
              throw 'Pull request base and head SHAs are required for targeted cleanup.'
            }

            # Compare the PR head, not the synthetic merge commit checked out by Actions.
            $gitStartInfo = [System.Diagnostics.ProcessStartInfo]::new('git')
            $gitStartInfo.WorkingDirectory = $env:GITHUB_WORKSPACE
            $gitStartInfo.UseShellExecute = $false
            $gitStartInfo.RedirectStandardOutput = $true
            $gitStartInfo.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            foreach ($argument in @('diff', '--name-only', '--diff-filter=ACMRT', '--find-renames', '-z', "${baseSha}...${headSha}", '--')) {
              $gitStartInfo.ArgumentList.Add($argument)
            }

            $gitProcess = [System.Diagnostics.Process]::Start($gitStartInfo)
            try {
              $changedPathsOutput = $gitProcess.StandardOutput.ReadToEnd()
              $gitProcess.WaitForExit()
              if ($gitProcess.ExitCode -ne 0) {
                throw "Failed to determine pull request files (git exit code $($gitProcess.ExitCode))."
              }
            }
            finally {
              $gitProcess.Dispose()
            }

            $includePaths = @(
              foreach ($path in $changedPathsOutput.Split([char]0, [System.StringSplitOptions]::RemoveEmptyEntries)) {
                if ($path -match '[*?;\\]') {
                  throw "Pull request path cannot be represented as an exact CleanupCode include: $path"
                }

                if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $path) -PathType Leaf) {
                  $path
                }
              }
            )

            if ($includePaths.Count -eq 0) {
              Write-Host 'No existing changed files in this pull request. Skipping ReSharper cleanup.'
              exit 0
            }

            $cleanupArguments += "--include=$($includePaths -join ';')"
            Write-Host "Restricting cleanup to $($includePaths.Count) changed pull request file(s)."
          }

          Write-Host "Running ReSharper Cleanup Code on $slnPath ..."
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          dotnet @cleanupArguments
          $stopwatch.Stop()
          $elapsed = $stopwatch.Elapsed
          Write-Host ""
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "CLEANUP TIMING SUMMARY" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Solution: ${{ matrix.solution }}"
          Write-Host "Duration: $($elapsed.ToString('hh\:mm\:ss\.fff'))"
          Write-Host "Minutes:  $([math]::Round($elapsed.TotalMinutes, 2))"
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host ""
          # CleanupCode returns 3 when no files match, including documentation-only PRs.
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $LASTEXITCODE -eq 3) {
            Write-Host 'No changed files matched this solution for cleanup.'
            exit 0
          }

          Write-Host "Cleanup completed."

      - name: Check for Uncommitted Changes
        shell: pwsh
        run: |
          Write-Host "Checking for modifications after cleanup..."
          $changes = git status --porcelain
          if ($changes) {
            Write-Host "ERROR: ReSharper cleanup modified files. The following changes are required:"
            git diff --color=always -- .
            Write-Host ""
            Write-Host "To resolve this locally run:"
            $slnFileName = $env:SLN_FILE_NAME
            if (-not $slnFileName -and $env:SLN_PATH) {
              $slnFileName = Split-Path -Path $env:SLN_PATH -Leaf
            }

            if ([string]::IsNullOrWhiteSpace($slnFileName)) {
              Write-Host "Unable to determine the solution file name for local cleanup. Check workflow logs for details."
            }
            else {
              $localCommand = "dotnet tool run jb cleanupcode --profile=`"Built-in: Full Cleanup`" --settings=`"Directory.DotSettings`" $slnFileName"
              Write-Host "Run the following from the repository root:"
              Write-Host $localCommand
            }
            exit 1
          } else {
            Write-Host "No modifications detected. Cleanup check passed."
          }

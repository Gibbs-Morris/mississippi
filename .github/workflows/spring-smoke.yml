name: Spring Smoke

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [main, 'feature/**', 'topic/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spring-smoke:
    name: Spring banking smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/tools
          key: spring-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json') }}
      - name: Verify Spring through the browser
        shell: pwsh
        run: ./test-spring.ps1 -InstallBrowserDependencies
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-smoke-${{ runner.os }}
          path: artifacts/spring/
          if-no-files-found: error
          retention-days: 7
